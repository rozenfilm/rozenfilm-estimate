<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>고객 후기 | 로젠필름</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<style>
  /* ===== rf-rev- 접두사로 스코프 지정: 기존 홈페이지 CSS와 충돌 방지 ===== */
  .rf-rev-section{
    font-family:'Noto Sans KR',sans-serif;
    background:#F7F8FA;
    padding:64px 0 72px;
  }
  .rf-rev-head{max-width:1100px;margin:0 auto 32px;padding:0 24px;text-align:center;}
  .rf-rev-eyebrow{
    font-size:12px;letter-spacing:.16em;font-weight:800;color:#2B6CB0;
    text-transform:uppercase;margin-bottom:10px;
  }
  .rf-rev-title{font-size:26px;font-weight:900;color:#1A2233;margin:0 0 8px;letter-spacing:-.01em;}
  .rf-rev-sub{font-size:14px;color:#7A8299;margin:0;}

  /* ---- 슬라이드 스테이지 ---- */
  .rf-rev-stage-wrap{max-width:400px;margin:0 auto;padding:0 24px;}
  .rf-rev-stage{
    position:relative;border-radius:18px;overflow:hidden;
    box-shadow:0 10px 28px rgba(26,34,51,.10);
    background:#12151C;aspect-ratio:4/5;cursor:pointer;
  }
  .rf-rev-slide{
    position:absolute;inset:0;opacity:0;transition:opacity .5s ease;
    display:flex;flex-direction:column;
  }
  .rf-rev-slide.active{opacity:1;z-index:1;}

  .rf-rev-slide-photo{flex:1;position:relative;background:#12151C;overflow:hidden;}
  .rf-rev-slide-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .rf-rev-slide-photo .rf-rev-noPhoto{
    width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#1E4E85,#12151C);color:#C7D2E3;
    font-size:14px;font-weight:700;text-align:center;padding:20px;
  }
  .rf-rev-slide-photo::after{
    content:'';position:absolute;left:0;right:0;bottom:0;height:60%;
    background:linear-gradient(to top, rgba(10,14,22,.88), rgba(10,14,22,0));
    pointer-events:none;
  }

  .rf-rev-slide-info{
    position:absolute;left:0;right:0;bottom:0;padding:20px 20px 22px;color:#fff;z-index:2;
  }
  .rf-rev-slide-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .rf-rev-slide-name{font-size:14px;font-weight:800;}
  .rf-rev-slide-loc{
    font-size:11px;font-weight:700;color:#DCE7F5;opacity:.85;margin-left:6px;
  }
  .rf-rev-slide-stars{color:#E0A526;font-size:12.5px;letter-spacing:1px;white-space:nowrap;}
  .rf-rev-slide-text{
    font-size:13.5px;line-height:1.55;font-weight:500;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    opacity:.95;
  }
  .rf-rev-tap-hint{
    font-size:10.5px;color:rgba(255,255,255,.6);margin-top:9px;font-weight:600;
    display:flex;align-items:center;gap:4px;
  }

  /* 진행 바 (인스타 스토리 스타일) */
  .rf-rev-bars{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:5px;z-index:3;}
  .rf-rev-bar{flex:1;height:3px;border-radius:99px;background:rgba(255,255,255,.35);overflow:hidden;}
  .rf-rev-bar-fill{height:100%;width:0%;background:#fff;border-radius:99px;}
  .rf-rev-bar.done .rf-rev-bar-fill{width:100%;transition:none;}
  .rf-rev-bar.active .rf-rev-bar-fill{width:0%;transition:width 2s linear;}
  .rf-rev-bar.active.run .rf-rev-bar-fill{width:100%;}

  .rf-rev-nav{
    position:absolute;top:0;bottom:0;width:32%;z-index:4;
  }
  .rf-rev-nav.prev{left:0;} .rf-rev-nav.next{right:0;}

  .rf-rev-cta{max-width:400px;margin:20px auto 0;padding:0 24px;text-align:center;}
  .rf-rev-cta a{
    display:inline-block;background:#2B6CB0;color:#fff;font-weight:800;font-size:13.5px;
    padding:12px 26px;border-radius:999px;text-decoration:none;
  }
  .rf-rev-cta p{font-size:12.5px;color:#9AA2B6;margin:0 0 12px;}

  .rf-rev-empty{
    text-align:center;color:#9AA2B6;font-size:13.5px;padding:50px 20px;
  }

  /* ---- 전체보기 모달 ---- */
  #rf-rev-modal{
    display:none;position:fixed;inset:0;background:rgba(10,14,22,.94);z-index:9999;
    align-items:flex-end;justify-content:center;
  }
  #rf-rev-modal.open{display:flex;}
  .rf-rev-modal-sheet{
    background:#fff;width:100%;max-width:480px;max-height:88vh;border-radius:20px 20px 0 0;
    overflow-y:auto;position:relative;font-family:'Noto Sans KR',sans-serif;
  }
  .rf-rev-modal-close{
    position:sticky;top:12px;float:right;margin-right:12px;
    width:32px;height:32px;border-radius:50%;background:rgba(26,34,51,.55);color:#fff;
    border:none;font-size:16px;cursor:pointer;z-index:5;
  }
  .rf-rev-modal-photos{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;}
  .rf-rev-modal-photos img{
    width:100%;flex:0 0 100%;aspect-ratio:4/3;object-fit:cover;scroll-snap-align:start;
  }
  .rf-rev-modal-body{padding:22px 22px 34px;}
  .rf-rev-modal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .rf-rev-modal-name{font-size:16px;font-weight:900;color:#1A2233;}
  .rf-rev-modal-stars{color:#E0A526;font-size:14px;letter-spacing:1px;}
  .rf-rev-modal-loc{
    display:inline-block;font-size:11.5px;font-weight:700;color:#2B6CB0;
    background:#EAF1FA;padding:3px 9px;border-radius:6px;margin-bottom:14px;
  }
  .rf-rev-modal-text{font-size:14.5px;line-height:1.75;color:#333;white-space:pre-wrap;}
  .rf-rev-modal-date{font-size:12px;color:#B0B6C4;margin-top:16px;}

  @media (max-width:480px){
    .rf-rev-stage-wrap, .rf-rev-cta{max-width:100%;}
  }
</style>
</head>
<body>

<section class="rf-rev-section">
  <div class="rf-rev-head">
    <div class="rf-rev-eyebrow">Customer Review</div>
    <h2 class="rf-rev-title">고객님들의 생생한 시공 후기</h2>
    <p class="rf-rev-sub">로젠필름과 함께한 공간의 변화를 확인해보세요</p>
  </div>

  <div class="rf-rev-stage-wrap">
    <div class="rf-rev-stage" id="rf-rev-stage">
      <div class="rf-rev-empty">후기를 불러오는 중입니다...</div>
    </div>
  </div>

</section>

<div id="rf-rev-modal">
  <div class="rf-rev-modal-sheet">
    <button class="rf-rev-modal-close" id="rf-rev-modal-close">✕</button>
    <div class="rf-rev-modal-photos" id="rf-rev-modal-photos"></div>
    <div class="rf-rev-modal-body">
      <div class="rf-rev-modal-top">
        <div class="rf-rev-modal-name" id="rf-rev-modal-name"></div>
        <div class="rf-rev-modal-stars" id="rf-rev-modal-stars"></div>
      </div>
      <div class="rf-rev-modal-loc" id="rf-rev-modal-loc"></div>
      <div class="rf-rev-modal-text" id="rf-rev-modal-text"></div>
      <div class="rf-rev-modal-date" id="rf-rev-modal-date"></div>
    </div>
  </div>
</div>

<script>
(function(){
  const firebaseConfig = {
    apiKey: "AIzaSyD1Nqi0J2ust7UTo6XQOLofZobOHS2O7dU",
    authDomain: "rozenfilm-estimate.firebaseapp.com",
    projectId: "rozenfilm-estimate",
    storageBucket: "rozenfilm-estimate.firebasestorage.app",
    messagingSenderId: "205994221853",
    appId: "1:205994221853:web:66cf3b8f7e90f9672581f4"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const SLIDE_MS = 2000; // 슬라이드 간격
  let reviews = [];
  let current = 0;
  let timer = null;

  function esc(str){
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }
  function fmtDate(ts){
    if (!ts || !ts.toDate) return '';
    const d = ts.toDate();
    return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
  }
  // 카드에 보여줄 짧은 2문장 정도만 추출
  function shortText(str){
    if (!str) return '';
    const sentences = str.replace(/\n+/g,' ').match(/[^.!?…]+[.!?…]?/g) || [str];
    let out = sentences.slice(0,2).join(' ').trim();
    if (out.length > 80) out = out.slice(0,78).trim() + '…';
    else if (sentences.length > 2) out += '…';
    return out;
  }

  const stage = document.getElementById('rf-rev-stage');

  db.collection('reviews')
    .where('status', '==', 'approved')
    .orderBy('createdAt', 'desc')
    .limit(30)
    .get()
    .then(snap => {
      if (snap.empty) {
        stage.innerHTML = '<div class="rf-rev-empty">아직 등록된 후기가 없습니다.</div>';
        return;
      }
      reviews = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      buildStage();
      startAutoplay();
    })
    .catch(err => {
      stage.innerHTML = '<div class="rf-rev-empty">후기를 불러오지 못했습니다.</div>';
      console.error(err);
    });

  function buildStage(){
    const bars = reviews.map((_, i) =>
      `<div class="rf-rev-bar" data-bar="${i}"><div class="rf-rev-bar-fill"></div></div>`
    ).join('');

    const slides = reviews.map((r, i) => {
      const photo = (r.photos && r.photos.length)
        ? `<img src="${r.photos[0]}" loading="lazy" />`
        : `<div class="rf-rev-noPhoto">${esc(r.location || '로젠필름')}<br>시공 후기</div>`;
      return `
        <div class="rf-rev-slide" data-slide="${i}">
          <div class="rf-rev-slide-photo">${photo}</div>
          <div class="rf-rev-slide-info">
            <div class="rf-rev-slide-top">
              <div><span class="rf-rev-slide-name">${esc(r.name||'익명')}</span><span class="rf-rev-slide-loc">${esc(r.location||'')}</span></div>
              <div class="rf-rev-slide-stars">${'★'.repeat(r.rating||0)}${'☆'.repeat(5-(r.rating||0))}</div>
            </div>
            <div class="rf-rev-slide-text">${esc(shortText(r.content))}</div>
            <div class="rf-rev-tap-hint">👆 눌러서 전체 후기 + 사진 보기</div>
          </div>
        </div>
      `;
    }).join('');

    stage.innerHTML = `
      <div class="rf-rev-bars">${bars}</div>
      ${slides}
      <div class="rf-rev-nav prev" data-nav="prev"></div>
      <div class="rf-rev-nav next" data-nav="next"></div>
    `;
    goTo(0, true);

    stage.addEventListener('click', (e) => {
      const nav = e.target.closest('.rf-rev-nav');
      if (nav) {
        stopAutoplay();
        goTo(current + (nav.dataset.nav === 'next' ? 1 : -1));
        startAutoplay();
        return;
      }
      openModal(reviews[current]);
    });
  }

  function goTo(idx, isInit){
    const n = reviews.length;
    current = ((idx % n) + n) % n;
    stage.querySelectorAll('.rf-rev-slide').forEach(s => {
      s.classList.toggle('active', parseInt(s.dataset.slide,10) === current);
    });
    stage.querySelectorAll('.rf-rev-bar').forEach((b, i) => {
      b.classList.remove('active','run','done');
      if (i < current) b.classList.add('done');
      if (i === current) b.classList.add('active');
    });
    if (!isInit) restartBarFill();
  }

  function restartBarFill(){
    const activeBar = stage.querySelector('.rf-rev-bar.active');
    if (!activeBar) return;
    requestAnimationFrame(() => requestAnimationFrame(() => activeBar.classList.add('run')));
  }

  function startAutoplay(){
    stopAutoplay();
    restartBarFill();
    timer = setInterval(() => {
      goTo(current + 1);
    }, SLIDE_MS);
  }
  function stopAutoplay(){
    if (timer) clearInterval(timer);
    timer = null;
  }

  // 모달 정지: 열려있는 동안 자동재생 중단
  const modal = document.getElementById('rf-rev-modal');
  function openModal(r){
    stopAutoplay();
    document.getElementById('rf-rev-modal-name').textContent = r.name || '익명';
    document.getElementById('rf-rev-modal-stars').textContent = '★'.repeat(r.rating||0) + '☆'.repeat(5-(r.rating||0));
    document.getElementById('rf-rev-modal-loc').textContent = r.location || '';
    document.getElementById('rf-rev-modal-text').textContent = r.content || '';
    document.getElementById('rf-rev-modal-date').textContent = fmtDate(r.createdAt);
    const photosWrap = document.getElementById('rf-rev-modal-photos');
    photosWrap.innerHTML = (r.photos && r.photos.length)
      ? r.photos.map(u => `<img src="${u}" />`).join('')
      : '';
    modal.classList.add('open');
  }
  function closeModal(){
    modal.classList.remove('open');
    startAutoplay();
  }
  document.getElementById('rf-rev-modal-close').addEventListener('click', closeModal);
  modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

  // 스테이지에 마우스 올리면 잠시 정지 (PC 사용성)
  stage.addEventListener('mouseenter', stopAutoplay);
  stage.addEventListener('mouseleave', () => { if (!modal.classList.contains('open')) startAutoplay(); });
})();
</script>
</body>
</html>
