<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>후기 관리자 | 로젠필름</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
<style>
  :root{
    --navy:#2B6CB0;--navy-dark:#1E4E85;--ink:#1A2233;--paper:#F2F4F8;
    --line:#E3E7EE;--gold:#E0A526;--white:#fff;--danger:#D64545;--ok:#1F9D64;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);}

  /* login */
  #loginView{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .login-card{
    background:#fff;border-radius:16px;padding:40px 32px;width:100%;max-width:360px;
    box-shadow:0 12px 32px rgba(26,34,51,.08);text-align:center;
  }
  .login-card h1{font-size:19px;font-weight:900;margin:0 0 4px;}
  .login-card p{font-size:13px;color:#8A92A6;margin:0 0 24px;}
  .login-card input{
    width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:9px;
    font-size:14px;margin-bottom:12px;font-family:inherit;
  }
  .login-card button{
    width:100%;padding:13px;border:none;border-radius:9px;background:var(--navy);
    color:#fff;font-weight:700;font-size:14.5px;cursor:pointer;font-family:inherit;
  }
  .login-err{color:var(--danger);font-size:12.5px;margin-top:10px;display:none;}

  /* app shell */
  #appView{display:none;}
  header{
    background:var(--navy);color:#fff;padding:20px 24px;
    display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:10;
  }
  header h1{font-size:16px;margin:0;font-weight:900;}
  header .who{font-size:12px;opacity:.75;margin-top:2px;}
  header button{
    background:rgba(255,255,255,.15);border:none;color:#fff;padding:8px 14px;
    border-radius:8px;font-size:12.5px;cursor:pointer;font-family:inherit;
  }

  .tabs{display:flex;gap:8px;padding:16px 24px 0;max-width:960px;margin:0 auto;}
  .tab{
    padding:9px 16px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;
    background:#fff;color:#8A92A6;border:1.5px solid var(--line);
  }
  .tab.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .tab .count{opacity:.75;font-weight:500;margin-left:3px;}

  .list{max-width:960px;margin:0 auto;padding:18px 24px 60px;display:flex;flex-direction:column;gap:14px;}
  .empty{text-align:center;color:#9AA2B6;font-size:13.5px;padding:60px 20px;}

  .card{
    background:#fff;border-radius:14px;padding:18px 20px;border:1px solid var(--line);
  }
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px;}
  .who-block .name{font-weight:800;font-size:14.5px;}
  .who-block .meta{font-size:12px;color:#9AA2B6;margin-top:2px;}
  .date-edit{display:flex;align-items:center;gap:6px;margin-top:8px;}
  .date-edit input[type=date]{
    border:1.5px solid var(--line);border-radius:7px;padding:5px 8px;
    font-size:12.5px;font-family:inherit;color:var(--ink);background:var(--paper);
  }
  .date-edit button{
    border:none;border-radius:7px;padding:6px 10px;font-size:12px;font-weight:700;
    background:var(--navy);color:#fff;cursor:pointer;font-family:inherit;
  }
  .date-edit .saved{font-size:11.5px;color:var(--ok);font-weight:700;display:none;}
  .stars-static{color:var(--gold);font-size:14px;letter-spacing:1px;white-space:nowrap;}
  .tag{
    display:inline-block;background:#EEF2F8;color:var(--navy-dark);font-size:11px;
    font-weight:700;padding:3px 9px;border-radius:6px;margin-top:6px;
  }
  .content{font-size:13.5px;line-height:1.65;color:#333;white-space:pre-wrap;margin:10px 0;}
  .photos{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .photos img{
    width:74px;height:74px;object-fit:cover;border-radius:8px;cursor:pointer;
    border:1px solid var(--line);display:block;
  }
  /* 관리자 사진 편집 */
  .ph{position:relative;width:74px;height:74px;}
  .ph .ph-del, .ph .ph-main{
    position:absolute;border:none;cursor:pointer;font-family:inherit;
    display:flex;align-items:center;justify-content:center;
  }
  .ph .ph-del{
    top:3px;right:3px;width:20px;height:20px;border-radius:50%;
    background:rgba(26,34,51,.72);color:#fff;font-size:11px;
  }
  .ph .ph-main{
    left:3px;bottom:3px;padding:2px 6px;border-radius:5px;
    background:rgba(26,34,51,.72);color:#fff;font-size:10px;font-weight:700;
  }
  .ph .ph-badge{
    position:absolute;left:3px;bottom:3px;padding:2px 6px;border-radius:5px;
    background:var(--gold);color:#fff;font-size:10px;font-weight:700;pointer-events:none;
  }
  .ph-add{
    width:74px;height:74px;border-radius:8px;border:1.5px dashed #C5CCDA;background:var(--paper);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    color:var(--navy);font-size:11px;font-weight:700;cursor:pointer;
  }
  .ph-add .plus{font-size:22px;line-height:1;}
  .ph-add.disabled{opacity:.45;cursor:not-allowed;}
  .ph-status{font-size:12px;font-weight:700;color:var(--navy);margin:-4px 0 12px;}
  .ph-status.err{color:var(--danger);}
  input.ph-file{display:none;}
  .actions{display:flex;gap:8px;}
  .actions button{
    flex:1;padding:10px;border:none;border-radius:8px;font-size:13px;font-weight:700;
    cursor:pointer;font-family:inherit;
  }
  .btn-approve{background:var(--ok);color:#fff;}
  .btn-reject{background:#F1F2F5;color:#7A8299;}
  .btn-delete{background:#FBEAEA;color:var(--danger);}
  .status-pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;}
  .pill-pending{background:#FFF4E0;color:#B8790A;}
  .pill-approved{background:#E6F7EE;color:var(--ok);}
  .pill-rejected{background:#F1F2F5;color:#8A92A6;}

  /* lightbox */
  #lightbox{
    display:none;position:fixed;inset:0;background:rgba(10,14,22,.9);z-index:100;
    align-items:center;justify-content:center;padding:20px;
  }
  #lightbox img{max-width:100%;max-height:92vh;border-radius:8px;}
</style>
</head>
<body>

<div id="loginView">
  <div class="login-card">
    <h1>로젠필름 후기 관리자</h1>
    <p>관리자 계정으로 로그인해주세요</p>
    <input type="text" id="loginEmail" placeholder="이메일" autocomplete="username" />
    <input type="password" id="loginPw" placeholder="비밀번호" autocomplete="current-password" />
    <button id="loginBtn">로그인</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<div id="appView">
  <header>
    <div>
      <h1>후기 관리</h1>
      <div class="who" id="whoLabel"></div>
    </div>
    <button id="logoutBtn">로그아웃</button>
  </header>

  <div class="tabs">
    <div class="tab active" data-status="pending">대기중 <span class="count" id="cntPending"></span></div>
    <div class="tab" data-status="approved">게시중 <span class="count" id="cntApproved"></span></div>
    <div class="tab" data-status="rejected">거절됨 <span class="count" id="cntRejected"></span></div>
  </div>

  <div class="list" id="list">
    <div class="empty">불러오는 중...</div>
  </div>
</div>

<div id="lightbox"><img id="lightboxImg" src="" /></div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyD1Nqi0J2ust7UTo6XQOLofZobOHS2O7dU",
    authDomain: "rozenfilm-estimate.firebaseapp.com",
    projectId: "rozenfilm-estimate",
    storageBucket: "rozenfilm-estimate.firebasestorage.app",
    messagingSenderId: "205994221853",
    appId: "1:205994221853:web:66cf3b8f7e90f9672581f4"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  const storage = firebase.storage();

  const ADMIN_EMAILS = ['kilaloss2@gmail.com', 'kilaloss1@gmail.com', 'kilaloss@naver.com'];

  const loginView = document.getElementById('loginView');
  const appView = document.getElementById('appView');
  const loginErr = document.getElementById('loginErr');

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const email = document.getElementById('loginEmail').value.trim();
    const pw = document.getElementById('loginPw').value;
    loginErr.style.display = 'none';
    try {
      await auth.signInWithEmailAndPassword(email, pw);
    } catch (e) {
      loginErr.textContent = '로그인 실패: 이메일 또는 비밀번호를 확인해주세요.';
      loginErr.style.display = 'block';
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', () => auth.signOut());

  auth.onAuthStateChanged((user) => {
    if (user && ADMIN_EMAILS.includes(user.email)) {
      loginView.style.display = 'none';
      appView.style.display = 'block';
      document.getElementById('whoLabel').textContent = user.email;
      loadReviews();
    } else {
      if (user) auth.signOut();
      appView.style.display = 'none';
      loginView.style.display = 'flex';
    }
  });

  let allReviews = [];
  let currentTab = 'pending';

  async function loadReviews() {
    db.collection('reviews').orderBy('createdAt', 'desc')
      .onSnapshot((snap) => {
        allReviews = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderCounts();
        renderList();
      }, (err) => {
        document.getElementById('list').innerHTML = `<div class="empty">불러오기 오류: ${err.message}</div>`;
      });
  }

  function renderCounts() {
    document.getElementById('cntPending').textContent = allReviews.filter(r => r.status === 'pending').length || '';
    document.getElementById('cntApproved').textContent = allReviews.filter(r => r.status === 'approved').length || '';
    document.getElementById('cntRejected').textContent = allReviews.filter(r => r.status === 'rejected').length || '';
  }

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentTab = tab.dataset.status;
      renderList();
    });
  });

  function fmtDate(ts) {
    if (!ts || !ts.toDate) return '';
    const d = ts.toDate();
    return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
  }

  function toDateInputValue(ts) {
    if (!ts || !ts.toDate) return '';
    const d = ts.toDate();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function renderList() {
    const list = document.getElementById('list');
    const items = allReviews.filter(r => r.status === currentTab);
    if (!items.length) {
      list.innerHTML = `<div class="empty">해당하는 후기가 없습니다.</div>`;
      return;
    }
    list.innerHTML = items.map(r => `
      <div class="card" data-id="${r.id}">
        <div class="card-top">
          <div class="who-block">
            <div class="name">${escapeHtml(r.name || '익명')} <span class="tag">${escapeHtml(r.location || '')}</span></div>
            <div class="meta">${fmtDate(r.createdAt)}${r.category ? ' · ' + escapeHtml(r.category) : ''}</div>
            <div class="date-edit">
              <input type="date" data-date-input value="${toDateInputValue(r.createdAt)}" />
              <button type="button" data-action="save-date">날짜 저장</button>
              <span class="saved" data-saved-label>저장됨</span>
            </div>
          </div>
          <div class="stars-static">${'★'.repeat(r.rating||0)}${'☆'.repeat(5-(r.rating||0))}</div>
        </div>
        <div class="content">${escapeHtml(r.content || '')}</div>
        ${renderPhotos(r)}
        <div class="actions">
          ${currentTab !== 'approved' ? `<button class="btn-approve" data-action="approve">게시 승인</button>` : ''}
          ${currentTab !== 'rejected' ? `<button class="btn-reject" data-action="reject">거절</button>` : ''}
          ${currentTab !== 'pending' ? `<button class="btn-reject" data-action="pending">대기로</button>` : ''}
          <button class="btn-delete" data-action="delete">삭제</button>
        </div>
      </div>
    `).join('');
  }

  // ===== 관리자 사진 편집 =====
  const MAX_PHOTOS = 10;
  const MAX_BYTES = 4.5 * 1024 * 1024; // Storage 규칙 5MB보다 여유 있게
  const photoStatus = {}; // 후기 id -> { text, err } (실시간 갱신으로 목록이 다시 그려져도 상태 유지)

  function renderPhotos(r) {
    const photos = r.photos || [];
    const st = photoStatus[r.id];
    const busy = st && !st.err;
    const full = photos.length >= MAX_PHOTOS;
    return `
      <div class="photos">
        ${photos.map((u, i) => `
          <div class="ph">
            <img src="${escapeHtml(u)}" data-full="${escapeHtml(u)}" />
            <button type="button" class="ph-del" data-action="photo-del" data-idx="${i}" title="사진 삭제">✕</button>
            ${i === 0
              ? `<span class="ph-badge">대표</span>`
              : `<button type="button" class="ph-main" data-action="photo-main" data-idx="${i}" title="대표 사진으로">대표로</button>`}
          </div>`).join('')}
        <label class="ph-add${busy || full ? ' disabled' : ''}" title="${full ? `최대 ${MAX_PHOTOS}장` : '사진 추가'}">
          <span class="plus">＋</span><span>${full ? '최대' : '사진 추가'}</span>
          <input type="file" class="ph-file" accept="image/*,.heic,.heif" multiple ${busy || full ? 'disabled' : ''} />
        </label>
      </div>
      ${st ? `<div class="ph-status${st.err ? ' err' : ''}">${escapeHtml(st.text)}</div>` : ''}`;
  }

  function setPhotoStatus(id, text, err = false, clearAfter = 0) {
    if (text) photoStatus[id] = { text, err }; else delete photoStatus[id];
    renderList();
    if (clearAfter) setTimeout(() => {
      if (photoStatus[id] && photoStatus[id].text === text) { delete photoStatus[id]; renderList(); }
    }, clearAfter);
  }

  // ---- 이미지 불러오기 / HEIC 변환 / 리사이즈 (고객 작성 페이지와 같은 방식) ----
  function loadImage(file) {
    return new Promise((resolve) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => resolve({ img, url });
      img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
      img.src = url;
    });
  }

  const HEIC2ANY_URL = 'https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';
  let heicLibPromise = null;
  function loadHeicLib() {
    if (window.heic2any) return Promise.resolve(window.heic2any);
    if (!heicLibPromise) {
      heicLibPromise = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = HEIC2ANY_URL;
        s.onload = () => window.heic2any ? resolve(window.heic2any) : reject(new Error('heic2any missing'));
        s.onerror = () => { heicLibPromise = null; reject(new Error('heic2any load failed')); };
        document.head.appendChild(s);
      });
    }
    return heicLibPromise;
  }
  function isHeic(file) {
    const t = (file.type || '').toLowerCase();
    return t.includes('heic') || t.includes('heif') || /\.(heic|heif)$/i.test(file.name || '');
  }
  async function heicToJpeg(file) {
    try {
      const heic2any = await loadHeicLib();
      const out = await heic2any({ blob: file, toType: 'image/jpeg', quality: 0.9 });
      return Array.isArray(out) ? out[0] : out;
    } catch (err) {
      console.error('HEIC 변환 실패', err);
      return null;
    }
  }

  function canvasToBlob(canvas, quality) {
    return new Promise((resolve) => canvas.toBlob((b) => resolve(b), 'image/jpeg', quality));
  }

  async function resizeImage(file, maxDim = 1600) {
    let loaded = await loadImage(file);
    if (!loaded && isHeic(file)) {
      const jpeg = await heicToJpeg(file);
      if (jpeg) loaded = await loadImage(jpeg);
    }
    if (!loaded) return null;
    const { img, url } = loaded;
    try {
      const steps = [[maxDim, 0.82], [maxDim, 0.7], [1280, 0.7], [1024, 0.65]];
      for (const [dim, quality] of steps) {
        let w = img.naturalWidth, h = img.naturalHeight;
        if (!w || !h) return null;
        const scale = Math.min(1, dim / Math.max(w, h));
        w = Math.round(w * scale); h = Math.round(h * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        const blob = await canvasToBlob(canvas, quality);
        if (blob && blob.size <= MAX_BYTES) return blob;
      }
      return null;
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  // ---- 사진 추가 ----
  document.getElementById('list').addEventListener('change', async (e) => {
    const input = e.target.closest('input.ph-file');
    if (!input) return;
    const card = input.closest('.card');
    const id = card.dataset.id;
    const rev = allReviews.find(r => r.id === id);
    const room = MAX_PHOTOS - ((rev && rev.photos) ? rev.photos.length : 0);
    const files = [...input.files];
    input.value = '';
    if (!files.length || room <= 0) return;
    const picked = files.slice(0, room);
    const skipped = files.length - picked.length;

    const newUrls = [];
    let failed = 0;
    try {
      for (let i = 0; i < picked.length; i++) {
        setPhotoStatus(id, `사진 처리 중... (${i + 1}/${picked.length})`);
        const blob = await resizeImage(picked[i]);
        if (!blob) { failed++; continue; }
        const ref = storage.ref(`reviews/${id}/admin_${Date.now()}_${i}.jpg`);
        await ref.put(blob, { contentType: 'image/jpeg' });
        newUrls.push(await ref.getDownloadURL());
      }
      if (newUrls.length) {
        await db.collection('reviews').doc(id).update({
          photos: firebase.firestore.FieldValue.arrayUnion(...newUrls)
        });
      }
      const notes = [];
      if (newUrls.length) notes.push(`${newUrls.length}장 추가됨`);
      if (failed) notes.push(`${failed}장은 불러오지 못함`);
      if (skipped) notes.push(`${skipped}장은 최대 ${MAX_PHOTOS}장 초과로 제외`);
      setPhotoStatus(id, notes.join(' · ') || '추가된 사진이 없습니다', !newUrls.length, 3000);
    } catch (err) {
      console.error(err);
      // 업로드는 됐는데 문서 저장이 실패한 경우, 고아 파일 정리
      for (const u of newUrls) { try { await storage.refFromURL(u).delete(); } catch (_) {} }
      setPhotoStatus(id, '사진 추가 중 오류가 발생했습니다: ' + (err.code || err.message), true, 6000);
    }
  });

  async function deletePhoto(id, idx) {
    const rev = allReviews.find(r => r.id === id);
    if (!rev || !rev.photos || !rev.photos[idx]) return;
    if (!confirm('이 사진을 삭제할까요? 되돌릴 수 없습니다.')) return;
    const url = rev.photos[idx];
    try {
      await db.collection('reviews').doc(id).update({
        photos: firebase.firestore.FieldValue.arrayRemove(url)
      });
      try { await storage.refFromURL(url).delete(); } catch (_) {}
      setPhotoStatus(id, '사진 삭제됨', false, 2000);
    } catch (err) {
      console.error(err);
      setPhotoStatus(id, '사진 삭제 중 오류: ' + (err.code || err.message), true, 6000);
    }
  }

  async function makeMainPhoto(id, idx) {
    const rev = allReviews.find(r => r.id === id);
    if (!rev || !rev.photos || !rev.photos[idx]) return;
    const photos = [...rev.photos];
    const [picked] = photos.splice(idx, 1);
    photos.unshift(picked);
    try {
      await db.collection('reviews').doc(id).update({ photos });
    } catch (err) {
      console.error(err);
      setPhotoStatus(id, '대표 사진 변경 중 오류: ' + (err.code || err.message), true, 6000);
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  document.getElementById('list').addEventListener('click', async (e) => {
    const img = e.target.closest('.photos img');
    if (img) {
      document.getElementById('lightboxImg').src = img.dataset.full;
      document.getElementById('lightbox').style.display = 'flex';
      return;
    }
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const card = btn.closest('.card');
    const id = card.dataset.id;
    const action = btn.dataset.action;

    if (action === 'photo-del') { await deletePhoto(id, parseInt(btn.dataset.idx, 10)); return; }
    if (action === 'photo-main') { await makeMainPhoto(id, parseInt(btn.dataset.idx, 10)); return; }

    if (action === 'save-date') {
      const input = card.querySelector('[data-date-input]');
      if (!input.value) return;
      const [y, m, d] = input.value.split('-').map(Number);
      const newDate = new Date(y, m - 1, d, 12, 0, 0); // 정오로 고정해 시간대 문제 방지
      await db.collection('reviews').doc(id).update({
        createdAt: firebase.firestore.Timestamp.fromDate(newDate)
      });
      const label = card.querySelector('[data-saved-label]');
      label.style.display = 'inline';
      setTimeout(() => { label.style.display = 'none'; }, 1500);
      return;
    }
    if (action === 'approve') await db.collection('reviews').doc(id).update({ status: 'approved' });
    if (action === 'reject') await db.collection('reviews').doc(id).update({ status: 'rejected' });
    if (action === 'pending') await db.collection('reviews').doc(id).update({ status: 'pending' });
    if (action === 'delete') {
      if (!confirm('이 후기를 완전히 삭제할까요? 되돌릴 수 없습니다.')) return;
      const rev = allReviews.find(r => r.id === id);
      if (rev && rev.photos && rev.photos.length) {
        for (const url of rev.photos) {
          try { await storage.refFromURL(url).delete(); } catch (e) {}
        }
      }
      await db.collection('reviews').doc(id).delete();
    }
  });

  document.getElementById('lightbox').addEventListener('click', () => {
    document.getElementById('lightbox').style.display = 'none';
  });
</script>
</body>
</html>
